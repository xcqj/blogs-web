name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 门禁：单测（app/utils/__tests__，19 例）+ 生产构建。
      # 本仓无 lint / typecheck 脚本（D30 未引 @nuxt/eslint），故不设该门禁。
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
